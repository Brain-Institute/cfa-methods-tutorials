### FINAL DATA EXPORT:
final_output_dir: '_final_output'   # Set as blank / null to save in main project directory
output_sets:                        # Note: All toggles only add data IF PRESENT in expected root output folder subdirectories; mismatches / unfound data will trigger printed warnings -- and fill in missing data with NaNs -- but will otherwise mostly not hard-fail
  morphometry:  True                # Toggles inclusion of anatomical volume data from morphometry stage (auxiliary / support script)
  HMM_features: True                # Toggles inclusion of data from 'HMM_decoding' stage above (i.e. metrics related to time-resolved state assignments for each subject, as well as summary-level variables like total occupancy rates, dwell times, etc.)
  HMM_states:   True                # Toggles inclusion of data from 'HMM_feature_engineering' stage above (i.e. metrics related to interpreting model states)
  graph_metrics_un_epoched: True    # Toggles inclusion of session-level graph metrics data (i.e. centralities & modularities calculated across entire neuroimaging sessions; "un-epoched")
  graph_metrics_epoched:    True    # Toggles inclusion of time-resolved (epoched) graph_metrics data, if present -- This set of output contributes by far the greatest total column count in the final export data

